<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockfish Analysis Board</title>

  <!-- Chessboard.js CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e2f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
      color: #f0c040;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    .main-container {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    /* ----- Board column ----- */
    .board-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #myBoard {
      width: 480px;
      max-width: 90vw;
    }

    .eval-bar-container {
      width: 100%;
      height: 28px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
    }

    .eval-bar-fill {
      height: 100%;
      width: 50%;
      background: #f0f0f0;
      transition: width 0.35s ease;
      border-radius: 6px;
    }

    .eval-bar-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      font-weight: 700;
      color: #111;
      pointer-events: none;
      text-shadow: 0 0 3px rgba(255,255,255,0.6);
    }

    /* ----- Sidebar ----- */
    .sidebar {
      width: 340px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: #2a2a3d;
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid #3a3a50;
    }

    .panel h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #f0c040;
      margin-bottom: 10px;
      border-bottom: 1px solid #3a3a50;
      padding-bottom: 6px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #aaa;
    }

    .status-row span:last-child {
      color: #e0e0e0;
      font-weight: 600;
      text-align: right;
      max-width: 60%;
      word-break: break-word;
    }

    .best-move {
      font-size: 1.3rem;
      font-weight: 700;
      color: #4caf50;
      text-align: center;
      padding: 6px 0;
      min-height: 2.2rem;
    }

    .pv-line {
      font-size: 0.8rem;
      color: #bbb;
      line-height: 1.4;
      word-break: break-word;
      max-height: 80px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
    }

    /* ----- Controls ----- */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      padding: 9px 12px;
      border: none;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      background: #3a3a55;
      color: #e0e0e0;
    }

    button:hover {
      background: #4a4a6a;
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary {
      background: #f0c040;
      color: #1e1e2f;
    }

    button.primary:hover {
      background: #ffd860;
    }

    button.danger {
      background: #c0392b;
      color: #fff;
    }

    button.danger:hover {
      background: #e74c3c;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .depth-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .depth-control input[type="range"] {
      flex: 1;
      accent-color: #f0c040;
    }

    /* ----- Move history ----- */
    .move-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.7;
      font-family: 'Courier New', monospace;
      color: #ccc;
    }

    .move-list .move-number {
      color: #777;
      margin-right: 4px;
    }

    .move-list .white-move {
      color: #fff;
      font-weight: 600;
    }

    .move-list .black-move {
      color: #f0c040;
      font-weight: 600;
    }

    /* ----- FEN / PGN inputs ----- */
    .fen-input,
    .pgn-input {
      width: 100%;
      padding: 8px 10px;
      background: #1e1e2f;
      border: 1px solid #3a3a50;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      resize: vertical;
    }

    .fen-input:focus,
    .pgn-input:focus {
      outline: none;
      border-color: #f0c040;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .input-row button {
      flex: 1;
    }

    /* ----- Responsive ----- */
    @media (max-width: 880px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
      .sidebar {
        width: 480px;
        max-width: 90vw;
      }
    }

    /* ----- Loading indicator ----- */
    .engine-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #888;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      display: inline-block;
    }

    .dot.ready {
      background: #4caf50;
      box-shadow: 0 0 6px #4caf50;
    }

    .dot.thinking {
      background: #f0c040;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to   { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <h1>♟ Stockfish Analysis Board</h1>
  <p class="subtitle">Powered by Stockfish 19 Lite (WASM) &middot; Drag pieces to play</p>

  <div class="main-container">

    <!-- ============ BOARD COLUMN ============ -->
    <div class="board-section">
      <div id="myBoard"></div>

      <!-- Evaluation bar -->
      <div class="eval-bar-container">
        <div class="eval-bar-fill" id="evalBarFill"></div>
        <span class="eval-bar-label" id="evalBarLabel">0.00</span>
      </div>

      <!-- Board controls -->
      <div class="controls-grid" style="width:100%;">
        <button class="primary" id="btnAnalyze">🔍 Analyze</button>
        <button id="btnHint">💡 Best Move</button>
        <button id="btnFlip">🔄 Flip Board</button>
        <button class="danger" id="btnReset">♻ New Game</button>
      </div>
    </div>

    <!-- ============ SIDEBAR ============ -->
    <div class="sidebar">

      <!-- Engine analysis panel -->
      <div class="panel">
        <h2>Engine Analysis</h2>
        <div class="engine-status" style="margin-bottom:8px;">
          <span class="dot" id="engineDot"></span>
          <span id="engineStatusText">Initializing engine…</span>
        </div>
        <div class="best-move" id="bestMoveDisplay">—</div>
        <div class="status-row">
          <span>Evaluation</span>
          <span id="evalDisplay">0.00</span>
        </div>
        <div class="status-row">
          <span>Depth</span>
          <span id="depthDisplay">—</span>
        </div>
        <div class="status-row">
          <span>Nodes</span>
          <span id="nodesDisplay">—</span>
        </div>
        <div class="pv-line" id="pvDisplay">Principal variation will appear here…</div>
        <div class="depth-control" style="margin-top:10px;">
          <label for="depthSlider">Depth</label>
          <input type="range" id="depthSlider" min="5" max="22" value="12" step="1">
          <span id="depthValue" style="min-width:24px;text-align:right;">12</span>
        </div>
      </div>

      <!-- Move history -->
      <div class="panel">
        <h2>Move History</h2>
        <div class="move-list" id="moveList">No moves yet.</div>
      </div>

      <!-- FEN import -->
      <div class="panel">
        <h2>FEN</h2>
        <textarea class="fen-input" id="fenInput" rows="2" spellcheck="false"
          placeholder="Paste a FEN string…"></textarea>
        <div class="input-row">
          <button id="btnLoadFen">Load FEN</button>
          <button id="btnCopyFen">Copy FEN</button>
        </div>
      </div>

      <!-- PGN import -->
      <div class="panel">
        <h2>PGN</h2>
        <textarea class="pgn-input" id="pgnInput" rows="4" spellcheck="false"
          placeholder="Paste PGN here…"></textarea>
        <div class="input-row">
          <button id="btnLoadPgn">Load PGN</button>
          <button id="btnCopyPgn">Copy PGN</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <!-- jQuery (required by chessboard.js) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- chessboard.js -->
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <!-- chess.js (move generation / validation / FEN / PGN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>

  <!-- Stockfish 19 Lite (single-threaded WASM – no CORS headers needed) -->
  <script>
    // We'll load the engine as a Web Worker after the page is ready.
    // Using the "lite single-threaded" build from nmrugg/stockfish.js
    // via jsDelivr CDN.  This is ~1.7 MB and runs everywhere without
    // special COOP/COEP headers.
  </script>

  <script>
    /* ============================================================
       GLOBAL STATE
       ============================================================ */
    let board = null;                 // chessboard.js instance
    let game = new Chess();           // chess.js game instance
    let stockfishWorker = null;       // Web Worker running Stockfish
    let engineReady = false;          // UCI handshake completed
    let isThinking = false;           // engine currently analyzing
    let analysisDepth = 12;           // default depth
    let currentBestMove = null;       // UCI move string (e.g. "e2e4")
    let lastEval = null;              // numeric evaluation (centipawns or mate)
    let lastEvalType = 'cp';          // 'cp' or 'mate'
    let pendingAnalysis = false;      // analysis requested but engine busy

    const $board = $('#myBoard');
    const $moveList = $('#moveList');
    const $bestMoveDisplay = $('#bestMoveDisplay');
    const $evalDisplay = $('#evalDisplay');
    const $depthDisplay = $('#depthDisplay');
    const $nodesDisplay = $('#nodesDisplay');
    const $pvDisplay = $('#pvDisplay');
    const $evalBarFill = $('#evalBarFill');
    const $evalBarLabel = $('#evalBarLabel');
    const $engineDot = $('#engineDot');
    const $engineStatusText = $('#engineStatusText');
    const $depthSlider = $('#depthSlider');
    const $depthValue = $('#depthValue');
    const $fenInput = $('#fenInput');
    const $pgnInput = $('#pgnInput');

    /* ============================================================
       INITIALISE BOARD
       ============================================================ */
    function initBoard() {
      board = Chessboard('myBoard', {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
        pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/img/chesspieces/wikipedia/{piece}.png'
      });
      window.addEventListener('resize', () => board.resize());
    }

    /* ============================================================
       BOARD CALLBACKS
       ============================================================ */
    function onDragStart(source, piece) {
      // Do not allow moves if the game is over or engine is thinking
      if (game.game_over() || isThinking) return false;

      // Only allow the side whose turn it is to move
      if (game.turn() === 'w' && piece.search(/^b/) !== -1) return false;
      if (game.turn() === 'b' && piece.search(/^w/) !== -1) return false;

      return true;
    }

    function onDrop(source, target) {
      // See if the move is legal
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q' // Always promote to a queen for simplicity
      });

      // Illegal move – snap piece back
      if (move === null) return 'snapback';

      // Update the move history and trigger analysis
      updateMoveHistory();
      clearAnalysisDisplay();
      requestAnalysis();
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    /* ============================================================
       MOVE HISTORY
       ============================================================ */
    function updateMoveHistory() {
      const history = game.history({ verbose: true });
      if (history.length === 0) {
        $moveList.html('No moves yet.');
        return;
      }

      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNumber = Math.floor(i / 2) + 1;
        const whiteMove = history[i];
        const blackMove = history[i + 1];

        html += `<span class="move-number">${moveNumber}.</span>`;
        html += `<span class="white-move">${whiteMove.san}</span>`;
        if (blackMove) {
          html += ` <span class="black-move">${blackMove.san}</span>`;
        }
        html += '<br>';
      }
      $moveList.html(html);
      // Scroll to bottom
      $moveList.scrollTop($moveList[0].scrollHeight);
    }

    /* ============================================================
       STOCKFISH ENGINE
       ============================================================ */
    function initEngine() {
      // Path to the lite single-threaded Stockfish 19 build
      const engineJs = 'https://cdn.jsdelivr.net/npm/stockfish@19.0.0/src/stockfish-19-lite-single.js';

      try {
        stockfishWorker = new Worker(engineJs);
      } catch (e) {
        // Fallback: try the older stockfish.js CDN
        try {
          stockfishWorker = new Worker('https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish.js');
        } catch (e2) {
          setEngineStatus('error', 'Failed to load engine');
          return;
        }
      }

      stockfishWorker.onmessage = handleEngineMessage;

      // UCI handshake
      sendCommand('uci');
    }

    function sendCommand(cmd) {
      if (stockfishWorker) {
        stockfishWorker.postMessage(cmd);
      }
    }

    function handleEngineMessage(event) {
      const line = event.data;
      if (typeof line !== 'string') return;

      // ---- UCI handshake ----
      if (line === 'uciok') {
        sendCommand('isready');
        return;
      }
      if (line === 'readyok') {
        engineReady = true;
        setEngineStatus('ready', 'Engine ready');
        return;
      }

      // ---- Analysis info lines ----
      if (line.startsWith('info depth')) {
        parseInfoLine(line);
      }

      // ---- Best move ----
      if (line.startsWith('bestmove')) {
        const parts = line.split(' ');
        const move = parts[1];
        if (move && move !== '(none)') {
          currentBestMove = move;
          displayBestMove(move);
        }
        isThinking = false;
        setEngineStatus('ready', 'Engine ready');
        // If another analysis was requested while we were thinking, run it
        if (pendingAnalysis) {
          pendingAnalysis = false;
          requestAnalysis();
        }
      }
    }

    /* ------------------------------------------------------------
       Parse UCI "info" lines to extract eval, depth, nodes, PV
       ------------------------------------------------------------ */
    function parseInfoLine(line) {
      // Depth
      const depthMatch = line.match(/depth (\d+)/);
      if (depthMatch) {
        $depthDisplay.text(depthMatch[1]);
      }

      // Nodes
      const nodesMatch = line.match(/nodes (\d+)/);
      if (nodesMatch) {
        const n = parseInt(nodesMatch[1], 10);
        $nodesDisplay.text(n.toLocaleString());
      }

      // Score (cp or mate)
      const cpMatch = line.match(/score cp (-?\d+)/);
      const mateMatch = line.match(/score mate (-?\d+)/);
      if (cpMatch) {
        const cp = parseInt(cpMatch[1], 10);
        lastEval = cp;
        lastEvalType = 'cp';
        updateEvalDisplay(cp, 'cp');
      } else if (mateMatch) {
        const mateIn = parseInt(mateMatch[1], 10);
        lastEval = mateIn;
        lastEvalType = 'mate';
        updateEvalDisplay(mateIn, 'mate');
      }

      // Principal variation
      const pvMatch = line.match(/ pv (.+)/);
      if (pvMatch) {
        const pv = pvMatch[1].trim();
        $pvDisplay.text(pv);
      }
    }

    /* ------------------------------------------------------------
       Display helpers
       ------------------------------------------------------------ */
    function updateEvalDisplay(value, type) {
      if (type === 'mate') {
        const label = value > 0 ? `M${value}` : `M${Math.abs(value)}`;
        $evalDisplay.text(label);
        // Mate in N for white → bar full white; mate for black → full black
        const pct = value > 0 ? 100 : 0;
        $evalBarFill.css('width', pct + '%');
        $evalBarLabel.text(label);
      } else {
        // Centipawns: convert to pawn units
        const pawns = (value / 100).toFixed(2);
        $evalDisplay.text(pawns);
        // Map evaluation to bar width (sigmoid-ish)
        // Clamp between -8 and +8 pawns for visual purposes
        const clamped = Math.max(-800, Math.min(800, value));
        const pct = 50 + (clamped / 800) * 50; // 0–100
        $evalBarFill.css('width', pct + '%');
        $evalBarLabel.text(pawns);
      }
    }

    function displayBestMove(uciMove) {
      // Convert UCI move (e2e4) to SAN for readability
      const tempGame = new Chess(game.fen());
      try {
        const from = uciMove.substring(0, 2);
        const to = uciMove.substring(2, 4);
        const promotion = uciMove.length > 4 ? uciMove[4] : undefined;
        const move = tempGame.move({ from, to, promotion });
        if (move) {
          $bestMoveDisplay.text(move.san);
        } else {
          $bestMoveDisplay.text(uciMove);
        }
      } catch (e) {
        $bestMoveDisplay.text(uciMove);
      }
    }

    function clearAnalysisDisplay() {
      $bestMoveDisplay.text('—');
      $pvDisplay.text('Analyzing…');
      $depthDisplay.text('—');
      $nodesDisplay.text('—');
    }

    function setEngineStatus(state, text) {
      $engineDot.removeClass('ready thinking');
      if (state === 'ready') $engineDot.addClass('ready');
      if (state === 'thinking') $engineDot.addClass('thinking');
      $engineStatusText.text(text);
    }

    /* ============================================================
       ANALYSIS REQUEST
       ============================================================ */
    function requestAnalysis() {
      if (!engineReady) {
        pendingAnalysis = true;
        return;
      }
      if (isThinking) {
        pendingAnalysis = true;
        return;
      }

      isThinking = true;
      pendingAnalysis = false;
      setEngineStatus('thinking', 'Analyzing…');
      clearAnalysisDisplay();

      // Stop any previous search, set new position, and go
      sendCommand('stop');
      // Small delay to let the engine settle before sending new position
      setTimeout(() => {
        sendCommand('position fen ' + game.fen());
        sendCommand('go depth ' + analysisDepth);
      }, 30);
    }

    /* ============================================================
       BOARD CONTROLS
       ============================================================ */
    function resetGame() {
      game = new Chess();
      board.position('start');
      $moveList.html('No moves yet.');
      clearAnalysisDisplay();
      currentBestMove = null;
      lastEval = null;
      $evalBarFill.css('width', '50%');
      $evalBarLabel.text('0.00');
      $evalDisplay.text('0.00');
      $fenInput.val('');
      $pgnInput.val('');
      // Optionally analyze the starting position
      requestAnalysis();
    }

    function flipBoard() {
      board.flip();
    }

    function showHint() {
      if (currentBestMove) {
        // Highlight the best move on the board
        const from = currentBestMove.substring(0, 2);
        const to = currentBestMove.substring(2, 4);
        $board.find('.square-' + from).addClass('highlight-hint');
        $board.find('.square-' + to).addClass('highlight-hint');
        setTimeout(() => {
          $board.find('.square-' + from).removeClass('highlight-hint');
          $board.find('.square-' + to).removeClass('highlight-hint');
        }, 3000);
      } else {
        // If no best move yet, run analysis first
        requestAnalysis();
      }
    }

    /* ============================================================
       FEN / PGN IMPORT & EXPORT
       ============================================================ */
    function loadFen() {
      const fen = $fenInput.val().trim();
      if (!fen) return;
      const newGame = new Chess();
      try {
        newGame.load(fen);
        game = newGame;
        board.position(game.fen());
        updateMoveHistory();
        clearAnalysisDisplay();
        requestAnalysis();
      } catch (e) {
        alert('Invalid FEN string.');
      }
    }

    function copyFen() {
      const fen = game.fen();
      navigator.clipboard.writeText(fen).then(() => {
        $fenInput.val(fen);
      });
    }

    function loadPgn() {
      const pgn = $pgnInput.val().trim();
      if (!pgn) return;
      const newGame = new Chess();
      try {
        newGame.load_pgn(pgn);
        game = newGame;
        board.position(game.fen());
        updateMoveHistory();
        clearAnalysisDisplay();
        requestAnalysis();
      } catch (e) {
        alert('Invalid PGN.');
      }
    }

    function copyPgn() {
      const pgn = game.pgn();
      navigator.clipboard.writeText(pgn).then(() => {
        $pgnInput.val(pgn);
      });
    }

    /* ============================================================
       EVENT BINDINGS
       ============================================================ */
    $(document).ready(function () {
      initBoard();
      initEngine();

      // Board controls
      $('#btnAnalyze').on('click', requestAnalysis);
      $('#btnHint').on('click', showHint);
      $('#btnFlip').on('click', flipBoard);
      $('#btnReset').on('click', resetGame);

      // Depth slider
      $depthSlider.on('input', function () {
        analysisDepth = parseInt($(this).val(), 10);
        $depthValue.text(analysisDepth);
      });

      // FEN / PGN
      $('#btnLoadFen').on('click', loadFen);
      $('#btnCopyFen').on('click', copyFen);
      $('#btnLoadPgn').on('click', loadPgn);
      $('#btnCopyPgn').on('click', copyPgn);

      // Add highlight style for hint
      $('<style>')
        .prop('type', 'text/css')
        .html(`
          .highlight-hint {
            box-shadow: inset 0 0 3px 3px #4caf50 !important;
            transition: box-shadow 0.2s;
          }
        `)
        .appendTo('head');
    });
  </script>

</body>
</html>
