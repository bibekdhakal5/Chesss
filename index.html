<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stockfish Test</title>
</head>
<body>
    <h2>Stockfish Engine Test</h2>
    <button onclick="startEngine()">Start Engine</button>
    <button onclick="getBestMove()">Get Best Move (Starting Position)</button>
    <pre id="output">Engine not loaded...</pre>

    <script>
        let stockfish = null;

        function startEngine() {
            // Ensure stockfish-19-lite-single.js and the corresponding .wasm file are in the same directory as this html file
            // Note: If it's a GitHub Pages repository, the path is usually './stockfish-19-lite-single.js'
            stockfish = new Worker('./stockfish-19-lite-single.js');

            stockfish.onmessage = function(event) {
                const line = event.data;
                document.getElementById('output').textContent += line + '\n';
                
                // If the engine is ready, you can automatically start computing
                if (line === 'uciok') {
                    console.log('Engine initialized successfully');
                }
            };

            // Initialize UCI protocol
            stockfish.postMessage('uci');
            document.getElementById('output').textContent = 'Engine loading...\n';
        }

        function getBestMove() {
            if (!stockfish) {
                alert('Please click "Start Engine" first!');
                return;
            }

            // Set starting position
            stockfish.postMessage('position startpos');
            // Let the engine think for 1000 milliseconds
            stockfish.postMessage('go movetime 1000');
        }
    </script>
</body>
</html>
