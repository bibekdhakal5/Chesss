
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stockfish Chess</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#f3f4f6;
font-family:system-ui,Arial,sans-serif;padding:16px}
main{max-width:520px;margin:auto}
h1{text-align:center;font-size:25px;margin:5px}
.sub{text-align:center;color:#9ca3af;font-size:13px;margin:6px 0 16px}
.panel{background:#1f2937;padding:12px;border-radius:12px;margin-bottom:12px}
#status{font-weight:600}
#engine{color:#a7f3d0;font-size:13px;margin-top:6px;overflow-wrap:anywhere}
#board{display:grid;grid-template-columns:repeat(8,1fr);
width:100%;aspect-ratio:1;margin:12px 0;touch-action:manipulation}
.sq{position:relative;border:0;padding:0;display:flex;
align-items:center;justify-content:center;aspect-ratio:1;
font-size:clamp(25px,8vw,43px);cursor:pointer}
.light{background:#eeeed2}.dark{background:#769656}
.sq.white{color:#fff;text-shadow:1px 1px 2px #111,-1px -1px 1px #111}
.sq.black{color:#171717}
.sq.selected{box-shadow:inset 0 0 0 4px #facc15}
.sq.target:after{content:"";position:absolute;width:23%;height:23%;
border-radius:50%;background:#183b2288}
.sq.capture:after{content:"";position:absolute;inset:3px;
border:4px solid #183b2288;border-radius:50%}
.coord{position:absolute;left:3px;top:1px;font-size:10px;
font-weight:bold;color:#333;pointer-events:none}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button,select{font:inherit;border-radius:8px;padding:11px;
border:1px solid #4b5563;background:#374151;color:white}
button:active{opacity:.75}
.primary{background:#166534}
label{font-size:13px;color:#d1d5db}
select{width:100%;margin-top:5px}
#moves{font-size:13px;line-height:1.8;overflow-wrap:anywhere;
max-height:125px;overflow:auto;color:#d1d5db}
.small{font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<main>
<h1>♟ Stockfish Chess</h1>
<div class="sub">Single HTML file · Android-friendly</div>

<div class="panel">
  <div id="status">Loading chess rules…</div>
  <div id="engine">Stockfish is not loaded yet.</div>
</div>

<div id="board" aria-label="Chessboard"></div>

<div class="panel">
  <div class="controls">
    <button class="primary" id="new">New game</button>
    <button id="undo">Undo move</button>
    <button id="hint">Find best move</button>
    <button id="flip">Flip board</button>
  </div>
  <p><label for="side">Play as</label>
  <select id="side">
    <option value="w">White (move first)</option>
    <option value="b">Black</option>
  </select></p>
  <p><label for="depth">Analysis depth</label>
  <select id="depth">
    <option value="8">8 — fast</option>
    <option value="10">10 — balanced</option>
    <option value="12" selected>12 — recommended</option>
    <option value="15">15 — slower</option>
  </select></p>
  <button class="primary" id="analyze" style="width:100%">
    Analyze current position
  </button>
</div>

<div class="panel">
  <b>Moves</b>
  <div id="moves">No moves yet.</div>
</div>
<p class="small">
Stockfish runs on your device after loading. Keep the internet connected
to download the engine. Analysis uses CPU and battery.
</p>
</main>

<!-- Chess rules library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const files = "abcdefgh";
const pieces = {
  w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
  b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};

let game = new Chess();
let selected = null;
let legalTargets = [];
let flipped = false;
let worker = null;
let engineReady = false;
let engineBusy = false;
let waitingFor = "";
let bestMove = "";
let lastInfo = "";
let version = 0;

function sayStatus(message) { $("status").textContent = message; }
function sayEngine(message) { $("engine").textContent = message; }

function squareName(row,col) {
  return files[col] + (8-row);
}

function draw() {
  const board = $("board");
  board.innerHTML = "";
  const rows = Array.from({length:8},(_,i)=>i);
  const cols = Array.from({length:8},(_,i)=>i);
  if(flipped){rows.reverse();cols.reverse();}

  const moves = {};
  if(selected) {
    game.moves({square:selected,verbose:true}).forEach(m=>{
      moves[m.to] = m.captured ? "capture" : "target";
    });
  }

  for(const row of rows) {
    for(const col of cols) {
      const sq = squareName(row,col);
      const p = game.get(sq);
      const btn = document.createElement("button");
      btn.className = "sq " + ((files.indexOf(sq[0])+Number(sq[1]))%2
        ? "light" : "dark");
      if(selected===sq) btn.classList.add("selected");
      if(moves[sq]) btn.classList.add(moves[sq]);
      if(p) {
        btn.textContent = pieces[p.color][p.type];
        btn.classList.add(p.color==="w"?"white":"black");
      }
      if((flipped ? col===7 : col===0)) {
        const coord = document.createElement("span");
        coord.className="coord";
        coord.textContent=sq[1];
        btn.appendChild(coord);
      }
      btn.setAttribute("aria-label",sq+(p?" "+p.type:""));
      btn.onclick=()=>clickSquare(sq);
      board.appendChild(btn);
    }
  }

  const history = game.history();
  let text = "";
  for(let i=0;i<history.length;i+=2) {
    text += (i/2+1)+". "+history[i]+
      (history[i+1]?" "+history[i+1]:"")+"   ";
  }
  $("moves").textContent = text || "No moves yet.";
  $("moves").scrollTop=$("moves").scrollHeight;

  if(game.game_over()) {
    sayStatus(game.in_checkmate()
      ? "Checkmate! "+(game.turn()==="w"?"Black":"White")+" wins."
      : "Game over — draw.");
  } else {
    sayStatus((game.turn()==="w"?"White":"Black")+" to move"+
      (game.in_check()?" — CHECK!":""));
  }
}

function clickSquare(sq) {
  if(game.game_over() || engineBusy) return;

  const p = game.get(sq);
  if(selected) {
    const matching = game.moves({square:selected,verbose:true})
      .filter(m=>m.to===sq);

    if(matching.length) {
      let promotion;
      if(matching.some(m=>m.flags.includes("p"))) {
        promotion = (prompt("Promote to: q, r, b, or n","q")||"q")
          .toLowerCase();
        if(!["q","r","b","n"].includes(promotion)) promotion="q";
      }
      const move = game.move({from:selected,to:sq,promotion:promotion||"q"});
      selected=null;
      draw();
      if(move) afterPlayerMove();
      return;
    }
  }

  if(p && p.color===game.turn() &&
     (game.turn()===$("side").value || !engineReady)) {
    selected=sq;
    draw();
  } else {
    selected=null;
    draw();
  }
}

function afterPlayerMove() {
  version++;
  stopSearch();
  draw();
  if(game.game_over()) return;
  if(game.turn()!==$("side").value) {
    setTimeout(playEngineMove,100);
  } else {
    analyzePosition(false);
  }
}

function makeWorker() {
  // A Blob worker lets the one-file page import Stockfish from a CDN.
  // locateFile tells the WASM loader where its matching engine file lives.
  const base = "https://cdn.jsdelivr.net/npm/stockfish@19.0.1/bin/";
  const source = `
    self.Module = {
      locateFile: function(path) { return ${JSON.stringify(base)} + path; }
    };
    importScripts(${JSON.stringify(base+"stockfish-19-lite-single.js")});
  `;
  const blob = new Blob([source],{type:"text/javascript"});
  return new Worker(URL.createObjectURL(blob));
}

function loadEngine() {
  try {
    sayEngine("Downloading Stockfish Lite…");
    worker=makeWorker();
    worker.onmessage=e=>onEngineMessage(
      typeof e.data==="string"?e.data:String(e.data)
    );
    worker.onerror=e=>{
      sayEngine("Engine loading failed. Open this page through an HTTPS host, then retry.");
      engineReady=false;
      engineBusy=false;
    };
    worker.postMessage("uci");
  } catch(e) {
    sayEngine("Could not start engine: "+e.message);
  }
}

function onEngineMessage(line) {
  if(line.includes("id name")) sayEngine(line.trim());

  if(line.includes("uciok")) {
    worker.postMessage("isready");
  } else if(line.includes("readyok")) {
    engineReady=true;
    engineBusy=false;
    sayEngine("Stockfish ready. Choose a move or analyze.");
    draw();
    if(game.turn()!==$("side").value && !game.game_over()) {
      setTimeout(playEngineMove,150);
    } else {
      analyzePosition(false);
    }
  }

  if(line.startsWith("info ") && line.includes(" score ")) {
    const depth=line.match(/\bdepth (\d+)/);
    const cp=line.match(/\bscore cp (-?\d+)/);
    const mate=line.match(/\bscore mate (-?\d+)/);
    if(depth) {
      let evaluation = mate ? "Mate in "+mate[1] :
        cp ? (Number(cp[1])/100).toFixed(2)+" pawns" : "";
      if(evaluation) {
        lastInfo="Depth "+depth[1]+" · "+evaluation;
        sayEngine(lastInfo);
      }
    }
  }

  if(line.startsWith("bestmove ")) {
    bestMove=line.split(/\s+/)[1];
    engineBusy=false;
    if(waitingFor==="play" && bestMove && bestMove!=="(none)") {
      const from=bestMove.slice(0,2),to=bestMove.slice(2,4);
      const promotion=bestMove[4]||"q";
      const move=game.move({from,to,promotion});
      if(move) {
        version++;
        selected=null;
        draw();
        if(!game.game_over()) analyzePosition(false);
      }
    } else if(waitingFor==="hint") {
      sayEngine("Best move: "+(bestMove||"none")+
        (lastInfo?" · "+lastInfo:""));
    } else {
      sayEngine(lastInfo||"Analysis complete.");
    }
    waitingFor="";
  }
}

function stopSearch() {
  if(worker && engineBusy) {
    try { worker.postMessage("stop"); } catch(e) {}
  }
  engineBusy=false;
  waitingFor="";
}

function analyzePosition(asHint) {
  if(!engineReady || game.game_over()) {
    if(!engineReady) sayEngine("Waiting for Stockfish to load…");
    return;
  }
  stopSearch();
  bestMove="";
  lastInfo="";
  engineBusy=true;
  waitingFor=asHint?"hint":"analysis";
  worker.postMessage("position fen "+game.fen());
  worker.postMessage("go depth "+$("depth").value);
  sayEngine("Analyzing position…");
}

function playEngineMove() {
  if(!engineReady || game.game_over() || engineBusy) return;
  if(game.turn()===$("side").value) return;
  stopSearch();
  bestMove="";
  engineBusy=true;
  waitingFor="play";
  worker.postMessage("position fen "+game.fen());
  worker.postMessage("go depth "+$("depth").value);
  sayEngine("Stockfish is thinking…");
}

$("new").onclick=()=>{
  stopSearch();
  game.reset();
  selected=null;
  draw();
  if(engineReady && game.turn()!==$("side").value) playEngineMove();
  else if(engineReady) analyzePosition(false);
};

$("undo").onclick=()=>{
  stopSearch();
  game.undo();
  if(game.turn()!==$("side").value && game.history().length) game.undo();
  selected=null;
  version++;
  draw();
  if(engineReady) analyzePosition(false);
};

$("hint").onclick=()=>analyzePosition(true);
$("analyze").onclick=()=>analyzePosition(false);
$("flip").onclick=()=>{flipped=!flipped;draw();};
$("side").onchange=()=>{
  stopSearch();
  game.reset();
  selected=null;
  draw();
  if(engineReady && game.turn()!==$("side").value) playEngineMove();
  else if(engineReady) analyzePosition(false);
};

draw();
loadEngine();
})();
</script>
</body>
</html>
